<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WG Vorrat">
<meta name="theme-color" content="#2747E8">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>WG Vorrat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>WG Vorrat</h1><p id="sub">Leon · Lucio · Yannick</p></div>
    <button class="iconbtn" id="pushBtn" aria-label="Push-Nachrichten einstellen" aria-haspopup="dialog">🔔</button>
    <button class="iconbtn" id="soundBtn" aria-label="Ton an/aus">🔊</button>
    <button class="mechip" id="meBtn" aria-label="Person wechseln"></button>
  </header>
  <div id="notice"></div>
  <main id="view"></main>
</div>

<nav class="tabs" role="tablist"><div class="in">
  <button role="tab" data-tab="home" aria-selected="true"><span class="ic">🏠</span>Home</button>
  <button role="tab" data-tab="vorrat" aria-selected="false"><span class="ic">🧺</span>Vorrat</button>
  <button role="tab" data-tab="liste" aria-selected="false"><span class="ic">🛒</span>Einkaufsliste<span class="badge" id="listBadge" hidden></span></button>
  <button role="tab" data-tab="geld" aria-selected="false"><span class="ic">💶</span>Ausgaben</button>
  <button role="tab" data-tab="kalender" aria-selected="false"><span class="ic">📅</span>Kalender</button>
</div></nav>
<button class="chatfab" id="chatFab" aria-label="Chat öffnen" aria-expanded="false" aria-controls="chatPanel">💬<span class="badge" id="chatBadge" hidden></span></button>
<section class="chatpanel" id="chatPanel" role="dialog" aria-label="WG-Chat" hidden>
  <header><h2>💬 WG-Chat</h2><button class="iconbtn" id="chatClose" aria-label="Chat schließen">✕</button></header>
  <div class="chat" id="chatList"></div>
  <form id="chatForm"><textarea id="chatIn" rows="1" maxlength="500" placeholder="Nachricht an die WG…" aria-label="Nachricht"></textarea><button type="submit" aria-label="Senden">➤</button></form>
</section>
<div id="modal"></div>
<canvas id="confetti" hidden></canvas>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/fx.js"></script>
<script src="js/store.js"></script>
<script src="js/push.js"></script>
<script src="js/ui.js"></script>
<script src="js/chat.js"></script>
<script src="js/muell.js"></script>
<script src="js/vorrat.js"></script>
<script src="js/kalender.js"></script>
<script src="js/receipt.js"></script>
<script src="js/geld.js"></script>
<script src="js/home.js"></script>
<script src="js/main.js"></script>
</body>
</html>
