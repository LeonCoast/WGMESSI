<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WG Vorrat">
<meta name="theme-color" content="#2747E8">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>WG Vorrat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: one-screen phone app — sticky header, tab content, bottom tab bar. Tiles = big tap targets. */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --surface-2:#E3E9E4; --ink:#16201C; --muted:#5D6B64; --line:#D3DCD6;
  --accent:#2747E8; --accent-ink:#FFFFFF;
  --ok:#1E9E5A; --ok-bg:#DDF3E6; --low:#C98A00; --low-bg:#FFF1C9; --empty:#D93A2B; --empty-bg:#FFE0DB;
  --shadow:0 1px 2px rgba(22,32,28,.06),0 4px 14px rgba(22,32,28,.06);
  --f-display:"Bricolage Grotesque",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101513; --surface:#19201D; --surface-2:#222B27; --ink:#E9F0EC; --muted:#93A39B; --line:#2C3631;
  --accent:#7D93FF; --accent-ink:#0B1030;
  --ok:#4CD38A; --ok-bg:#16301F; --low:#F2C14E; --low-bg:#352B0F; --empty:#FF7A6B; --empty-bg:#3A1A16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#19201D; --surface-2:#222B27; --ink:#E9F0EC; --muted:#93A39B; --line:#2C3631;
  --accent:#7D93FF; --accent-ink:#0B1030;
  --ok:#4CD38A; --ok-bg:#16301F; --low:#F2C14E; --low-bg:#352B0F; --empty:#FF7A6B; --empty-bg:#3A1A16;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 110px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font:800 26px/1 var(--f-display);letter-spacing:-.02em}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px}
.mechip{height:42px;padding:0 12px 0 6px;border-radius:21px;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;font-weight:700}
.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:800 14px var(--f-display);color:#fff;flex:none}

.summary{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.low{background:var(--low-bg);color:var(--low)} .pill.empty{background:var(--empty-bg);color:var(--empty)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}

.mood{font:600 15px/1.35 var(--f-display);margin:0 0 14px;color:var(--muted)}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.cats button{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface-2);font-weight:600;font-size:14px}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.section-h{font:800 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.tile{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center;transition:transform .15s}
.tile .em{font-size:36px;line-height:1}
.tile .nm{font-weight:700;font-size:13.5px;line-height:1.15;word-break:break-word;hyphens:auto}
.tile .st{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.tile.full .st{color:var(--ok)}
.tile.low{background:var(--low-bg);border-color:var(--low)} .tile.low .st{color:var(--low)}
.tile.empty{background:var(--empty-bg);border-color:var(--empty)} .tile.empty .st{color:var(--empty)}
.tile.empty{animation:wobble 2.6s ease-in-out infinite}
.tile.bump{animation:bump .35s ease}
.tile .edit{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:8px;background:var(--surface-2);font-size:13px;display:grid;place-items:center}
.add-tile{border:2px dashed var(--line);background:transparent;box-shadow:none;color:var(--muted)}
@keyframes wobble{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-4deg)}92%{transform:rotate(4deg)}95%{transform:rotate(-2deg)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(.9)}75%{transform:scale(1.06)}100%{transform:scale(1)}}
.hint{color:var(--muted);font-size:13px;margin:12px 2px 0}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px 12px 12px 14px;box-shadow:var(--shadow)}
.row .em{font-size:28px;flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-size:15px}
.row .tx span{color:var(--muted);font-size:13px}
.row .stbar{width:6px;align-self:stretch;border-radius:3px;flex:none}
.btn{padding:10px 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--empty-bg);color:var(--empty)}
.btn.wide{width:100%;padding:14px}
.empty-state{text-align:center;padding:40px 16px;color:var(--muted)}
.empty-state .big{font-size:52px}
.empty-state h3{font:800 20px var(--f-display);color:var(--ink);margin:8px 0 4px}

.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.person{background:var(--surface);border-radius:18px;padding:14px 8px 12px;text-align:center;box-shadow:var(--shadow);position:relative;min-width:0}
.person .avatar{width:44px;height:44px;font-size:19px;margin:0 auto 6px}
.person .crown{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-size:22px}
.person b{display:block;font-size:15px}
.person .num{font:800 22px var(--f-display);font-variant-numeric:tabular-nums}
.person small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.person .title{display:inline-block;margin-top:6px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2)}
.money{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.card{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.balance{display:flex;flex-direction:column;gap:6px;font-size:14px}
.balance div{display:flex;justify-content:space-between;gap:10px}
.bins{display:flex;gap:8px;margin:0 0 14px}
.bin{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);border:2px solid transparent;text-align:left;font-weight:700;font-size:14px;line-height:1.2}
.bin .em{font-size:24px;flex:none}
.bin small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ok);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bin.full{background:var(--empty-bg);border-color:var(--empty)} .bin.full small{color:var(--empty)}
.cal-h{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.cal-h h2{flex:1;min-width:0;margin:0;font:800 22px/1.1 var(--f-display)}
.cal-h .iconbtn{font-size:20px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding:2px 0}
.day{position:relative;min-width:0;min-height:56px;border-radius:10px;background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:3px;padding:5px 3px 4px 5px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.day.past{opacity:.55}
.day.today .dn{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 6px}
.day.multi{box-shadow:inset 0 0 0 2px var(--ink)}
.day .cnt{position:absolute;top:5px;right:4px;font-size:11px;line-height:16px;min-width:16px;border-radius:8px;background:var(--ink);color:var(--bg);text-align:center}
.day .bars{display:flex;flex-direction:column;gap:2px;width:100%}
.day .bars i{display:block;height:5px;border-radius:3px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 2px 0;font-size:13px;font-weight:700;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:6px;border-radius:3px}
.pos{color:var(--ok)} .neg{color:var(--empty)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:flex;gap:4px;width:100%;max-width:520px}
nav.tabs button{flex:1;min-width:0;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
nav.tabs button .ic{font-size:22px}
nav.tabs button[aria-selected="true"]{color:var(--ink);background:var(--surface-2)}
.badge{position:absolute;top:2px;right:calc(50% - 26px);min-width:18px;height:18px;border-radius:9px;background:var(--empty);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}

.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:440px;background:var(--surface);border-radius:24px;padding:22px 20px 20px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:up .25s ease;max-height:90%;overflow:auto}
@media (min-width:600px){.scrim{align-items:center}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font:800 24px/1.1 var(--f-display);text-wrap:balance}
.sheet p.sub{margin:0 0 16px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{font:600 16px var(--f-body);padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.field-row{display:grid;grid-template-columns:90px 1fr;gap:10px}
.actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;gap:2px;margin:6px 0 14px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 4px;border-radius:12px;cursor:pointer;font-size:15px}
.opt input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex:none}
.opt span{width:24px;text-align:center;flex:none}
.topic{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.topic code{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--surface-2);border-radius:10px;padding:10px;font:13px/1.3 ui-monospace,Menlo,monospace}
.actions .btn{flex:1}
.names{display:grid;gap:10px;margin-top:6px}
.names button{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--surface-2);font:800 19px var(--f-display);text-align:left}
.names .avatar{width:42px;height:42px;font-size:18px}
.alertlist{display:flex;flex-direction:column;gap:8px;margin:0 0 16px}
.alertlist div{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px}
.alertlist .low{background:var(--low-bg)} .alertlist .empty{background:var(--empty-bg)}
.alertlist .em{font-size:26px}
.alertlist small{display:block;color:var(--muted)}
.siren{font-size:46px;display:block;animation:siren .6s ease-in-out infinite alternate}
@keyframes siren{from{transform:rotate(-10deg) scale(1)}to{transform:rotate(10deg) scale(1.1)}}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:16px;font-weight:700;max-width:calc(100% - 32px);width:max-content;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:drop .3s ease}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.notice{background:var(--low-bg);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:12px}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.statuspick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.statuspick button{padding:12px 6px;border-radius:14px;font-weight:700;font-size:13px;border:2px solid transparent}
.statuspick .s-full{background:var(--ok-bg);color:var(--ok)} .statuspick .s-low{background:var(--low-bg);color:var(--low)} .statuspick .s-empty{background:var(--empty-bg);color:var(--empty)}
.statuspick button[aria-pressed="true"]{border-color:currentColor}
.emoji-btn{width:100%;font-size:26px;padding:7px 0;border-radius:12px;border:2px solid var(--line);background:var(--bg)}
.emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;max-height:210px;overflow-y:auto;padding:8px;border-radius:14px;background:var(--surface-2);margin:-4px 0 12px}
.emoji-grid button{font-size:24px;height:44px;border-radius:10px}
.emoji-grid button[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
.emoji-grid .own{grid-column:1/-1;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);padding:4px 2px 0}
.emoji-grid .own input{width:64px;font-size:22px;text-align:center;padding:6px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:6px;padding-bottom:84px}
.msg{max-width:82%;padding:8px 12px 6px;border-radius:16px;border-top-left-radius:4px;align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-left:4px solid var(--c);min-width:0}
.msg.mine{align-self:flex-end;border-left:0;border-right:4px solid var(--c);border-top-left-radius:16px;border-top-right-radius:4px}
.msg .who{font-weight:800;font-size:12.5px;color:var(--c)}
.msg .txt{white-space:pre-wrap;word-break:break-word;font-size:15px}
.msg .time{font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;margin-top:2px}
.daysep{align-self:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface-2);padding:3px 10px;border-radius:999px;margin:8px 0 2px}
.chatbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--bg);padding:8px 16px;display:flex;justify-content:center}
.chatbar form{display:flex;gap:8px;width:100%;max-width:688px}
.chatbar textarea{flex:1;min-width:0;resize:none;font:500 16px/1.35 var(--f-body);padding:10px 14px;border-radius:20px;border:2px solid var(--line);background:var(--surface);color:var(--ink);max-height:110px}
.chatbar button{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:20px;flex:none;align-self:flex-end}
.gate{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .box{width:100%;max-width:360px;text-align:center}
.gate img{width:96px;height:96px;border-radius:24px;box-shadow:var(--shadow);margin-bottom:14px}
.gate h2{font:800 28px var(--f-display);margin:0 0 4px}
.gate p{color:var(--muted);margin:0 0 18px}
.gate input{width:100%;font:600 18px var(--f-body);text-align:center;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:10px}
.gate input.wrong{border-color:var(--empty);animation:shake .35s}
.gate .err{color:var(--empty);font-weight:700;min-height:22px;margin-top:8px}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.msg .del{border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;padding:0 0 0 8px;cursor:pointer}
.msg .del.armed{color:var(--empty)}
.msg .meta{display:flex;justify-content:flex-end;align-items:center}
.rlines{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.rline{display:grid;grid-template-columns:24px minmax(0,1fr) 86px;gap:8px;align-items:start;padding:10px;border-radius:14px;background:var(--surface-2)}
.rline.off{opacity:.55}
.rline input[type="checkbox"]{width:22px;height:22px;margin:11px 0 0;accent-color:var(--accent)}
.rline input:not([type]),.rline select{font:600 16px var(--f-body);padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.rline select{margin-top:6px;font-weight:500}
.rline .rl-price{text-align:right;font-variant-numeric:tabular-nums}
.rsum{display:flex;justify-content:space-between;font-weight:700;margin:0 2px 12px}
.rphoto{margin-bottom:12px} .rphoto summary{cursor:pointer;font-weight:700;color:var(--accent);padding:4px 2px}
.rimg{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:14px;background:var(--surface-2);margin:8px 0 12px}
.rtext{white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--surface-2);border-radius:12px;padding:10px;margin:8px 0 0;max-height:240px;overflow:auto}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:4px 0 16px}
.progress span{display:block;height:100%;width:3%;background:var(--accent);transition:width .3s}
.hello h2{margin:6px 0 2px;font:800 26px/1.1 var(--f-display)} .hello p{margin:0;color:var(--muted)}
.todos{display:flex;flex-direction:column;gap:8px}
.todo{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.todo .em{font-size:24px;flex:none;width:30px;text-align:center}
.todo .tx{flex:1;min-width:0;text-align:left;padding:0}
.todo .tx b{display:block;font-size:15px}
.todo .tx span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo .check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:15px;font-weight:800;color:transparent}
.todo.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.todo.done .tx b{text-decoration:line-through;color:var(--muted)}
.btn.sm{padding:8px 12px;font-size:14px}
.empty-mini{color:var(--muted);font-size:14px;margin:0;padding:4px 2px}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

/* ---------- Sounds (Web Audio, no files) ---------- */
let actx=null; let muted = ls.get("wg_muted")==="1";
/* iOS: Web Audio auch bei Lautlos-Schalter abspielen (Safari 16.4+) */
try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
function audio(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(actx&&actx.state!=="running") actx.resume().catch(()=>{}); return actx; }
/* Safari entsperrt Audio nicht immer beim ersten Tippen: bei jeder Geste erneut versuchen, bis es läuft */
function unlockAudio(){ const a=audio(); if(a&&a.state==="running"){ ["pointerdown","touchend","click","keydown"].forEach(ev=>document.removeEventListener(ev,unlockAudio,true)); } }
["pointerdown","touchend","click","keydown"].forEach(ev=>document.addEventListener(ev,unlockAudio,true));
function tone(f,start,dur,type="sine",vol=.18,f2){const a=audio(); if(!a||muted)return; const t=a.currentTime+start; const o=a.createOscillator(), g=a.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.05);}
/* Ein einziger, dezenter Hinweiston für alles */
const SFX = { ding(){ tone(880,0,.18,"sine",.12); tone(1320,.09,.25,"sine",.07); } };
/* Eigener Kauf-Sound: lege eine Datei "kauf.mp3" neben die index.html.
   Gibt es keine, wird einfach der normale Ding-Ton gespielt. */
const KAUF_SOUND = "kauf.mp3";
let kaufBuf=null, kaufTried=false;
async function loadKauf(){
  if(kaufTried) return; kaufTried=true;
  try{ const a=audio(); if(!a) return; const r=await fetch(KAUF_SOUND,{cache:"no-cache"}); if(!r.ok) return;
       kaufBuf=await a.decodeAudioData(await r.arrayBuffer()); }catch(e){ kaufBuf=null; }
}
loadKauf(); /* Dekodieren geht auch vor dem Entsperren, so ist der Ton schon beim ersten Kauf bereit */
function play(n){
  if(muted) return;
  try{
    if(n==="kauf" && kaufBuf){ const a=audio(); const src=a.createBufferSource(); src.buffer=kaufBuf; src.connect(a.destination); src.start(); return; }
    SFX.ding();
  }catch(e){}
}

/* ---------- Confetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("#confetti"); c.hidden=false; const x=c.getContext("2d"); const W=c.width=innerWidth, H=c.height=innerHeight;
  const cols=["#2747E8","#E0582E","#14946A","#F2C14E","#FF7A6B","#7D93FF"];
  const P=Array.from({length:140},()=>({x:W/2,y:H*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,s:(Math.random()-.5)*.3}));
  let f=0; (function step(){ x.clearRect(0,0,W,H); P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.s; x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()}); if(++f<150) requestAnimationFrame(step); else {x.clearRect(0,0,W,H); c.hidden=true;} })();
}

/* ---------- Toast ---------- */
let toastT; function toast(msg){ const el=document.createElement("div"); el.className="toast"; el.textContent=msg; document.querySelectorAll(".toast").forEach(t=>t.remove()); document.body.appendChild(el); clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),3200); }

/* ---------- Store (shared db, or local fallback) ---------- */
const state = { items:[], purchases:[], chat:[], bins:{}, away:[], prefs:{}, todos:[], chatOpen:false, calOff:0, loaded:false, shared:false, tab:"home", cat:"Alle", edit:false };
let me = ls.get("wg_me"); if(!PEOPLE.includes(me)) me=null;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const Store = {
  db:null,
  async init(){
    let db=null;
    try{
      if(!LOCAL_DEV && window.firebase && FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("HIER")){
        firebase.initializeApp(FIREBASE_CONFIG);
        const fs=firebase.firestore();
        const root=fs.collection("wgs").doc(WG_ID);
        db={ doc:p=>{const [c,id]=p.split("/"); return root.collection(c).doc(id)}, collection:c=>root.collection(c) };
      }
    }catch(e){ console.error(e); db=null; }
    if(db){
      this.db=db; state.shared=true;
      db.collection("items").onSnapshot(snap=>{ onItems(snap.docs.map(d=>({id:d.id,...d.data()})), snap.docChanges()); }, e=>showNotice("Keine Verbindung zur Datenbank. Prüfe die Firestore-Regeln oder lade neu."));
      db.collection("purchases").onSnapshot(snap=>{ state.purchases=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{});
      db.collection("chat").orderBy("at","desc").limit(300).onSnapshot(snap=>{ onChat(snap.docs.map(d=>({id:d.id,...d.data()})).reverse()); }, ()=>{});
      db.collection("away").onSnapshot(snap=>{ state.away=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{});
      db.collection("bins").onSnapshot(snap=>{ onBins(Object.fromEntries(snap.docs.map(d=>[d.id,d.data()])), snap.docChanges()); }, ()=>{});
      db.collection("todos").onSnapshot(snap=>{ state.todos=snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{});
      db.collection("prefs").onSnapshot(snap=>{ state.prefs=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()])); }, ()=>{});
    } else {
      showNotice(LOCAL_DEV ? "Lokaler Testmodus: Änderungen werden nur auf diesem Gerät gespeichert, keine Push-Nachrichten." : "Firebase ist noch nicht eingerichtet: Änderungen werden nur auf diesem Gerät gespeichert.");
      let saved=null; try{ saved=JSON.parse(ls.get("wg_local")||"null") }catch(e){}
      state.purchases = saved?.purchases||[]; state.chat = saved?.chat||[]; state.bins = saved?.bins||{}; state.away = saved?.away||[]; state.prefs = saved?.prefs||{}; state.todos = saved?.todos||[]; onItems(saved?.items||[],[]);
    }
  },
  saveLocal(){ ls.set("wg_local",JSON.stringify({items:state.items,purchases:state.purchases,chat:state.chat,bins:state.bins,away:state.away,prefs:state.prefs,todos:state.todos})) },
  async setItem(id,data){
    if(this.db){ try{ await this.db.doc("items/"+id).set(data) }catch(e){ writeErr(e) } }
    else { const i=state.items.findIndex(x=>x.id===id); const v={id,...data}; i<0?state.items.push(v):state.items[i]=v; this.saveLocal(); onItems(state.items,[]); }
  },
  async delItem(id){
    if(this.db){ try{ await this.db.doc("items/"+id).delete() }catch(e){ writeErr(e) } }
    else { state.items=state.items.filter(x=>x.id!==id); this.saveLocal(); onItems(state.items,[]); }
  },
  async addPurchase(p){
    const id=uid();
    if(this.db){ try{ await this.db.doc("purchases/"+id).set(p) }catch(e){ writeErr(e) } }
    else { state.purchases.push({id,...p}); this.saveLocal(); render(); }
  },
  async addChat(m){
    const id=String(m.at).padStart(15,"0")+"-"+uid();
    if(this.db){ try{ await this.db.doc("chat/"+id).set(m); return true }catch(e){ writeErr(e); return false } }
    else { state.chat.push({id,...m}); this.saveLocal(); onChat(state.chat); return true }
  },
  async delChat(id){
    if(this.db){ try{ await this.db.doc("chat/"+id).delete() }catch(e){ writeErr(e) } }
    else { state.chat=state.chat.filter(x=>x.id!==id); this.saveLocal(); onChat(state.chat); }
  },
  /* Bons liegen in einer eigenen Sammlung und werden nur bei Bedarf geladen (Fotos sind groß) */
  receipts:{},
  async addReceipt(r){
    const id=uid();
    if(this.db){ try{ await this.db.doc("receipts/"+id).set(r); this.receipts[id]=r; return id }catch(e){ writeErr(e); return null } }
    this.receipts[id]=r;
    let all={}; try{ all=JSON.parse(ls.get("wg_receipts")||"{}") }catch(e){}
    all[id]=r; try{ localStorage.setItem("wg_receipts",JSON.stringify(all)) }catch(e){ toast("Speicher voll: Bon-Foto nur bis zum Neuladen sichtbar.") }
    return id;
  },
  async getReceipt(id){
    if(this.receipts[id]) return this.receipts[id];
    if(this.db){ try{ const d=await this.db.doc("receipts/"+id).get(); return this.receipts[id]=d.exists?d.data():null }catch(e){ console.error(e); return null } }
    try{ return JSON.parse(ls.get("wg_receipts")||"{}")[id]||null }catch(e){ return null }
  },
  async setBin(id,data){
    if(this.db){ try{ await this.db.doc("bins/"+id).set(data) }catch(e){ writeErr(e) } }
    else { state.bins[id]=data; this.saveLocal(); render(); }
  },
  async setAway(id,data){
    if(this.db){ try{ await this.db.doc("away/"+id).set(data) }catch(e){ writeErr(e) } }
    else { const i=state.away.findIndex(x=>x.id===id); const v={id,...data}; i<0?state.away.push(v):state.away[i]=v; this.saveLocal(); render(); }
  },
  async delAway(id){
    if(this.db){ try{ await this.db.doc("away/"+id).delete() }catch(e){ writeErr(e) } }
    else { state.away=state.away.filter(x=>x.id!==id); this.saveLocal(); render(); }
  },
  async setTodo(id,data){
    if(this.db){ try{ await this.db.doc("todos/"+id).set(data) }catch(e){ writeErr(e) } }
    else { const i=state.todos.findIndex(x=>x.id===id); const v={id,...data}; i<0?state.todos.push(v):state.todos[i]=v; this.saveLocal(); render(); }
  },
  async delTodo(id){
    if(this.db){ try{ await this.db.doc("todos/"+id).delete() }catch(e){ writeErr(e) } }
    else { state.todos=state.todos.filter(x=>x.id!==id); this.saveLocal(); render(); }
  },
  async setPrefs(who,data){
    state.prefs[who]=data;
    if(this.db){ try{ await this.db.doc("prefs/"+who).set(data) }catch(e){ writeErr(e) } }
    else this.saveLocal();
  },
  async delPurchase(id){
    if(this.db){ try{ await this.db.doc("purchases/"+id).delete() }catch(e){ writeErr(e) } }
    else { state.purchases=state.purchases.filter(x=>x.id!==id); this.saveLocal(); render(); }
  }
};
function writeErr(e){ console.error(e); toast(e?.code==="permission-denied" ? "Keine Schreibrechte. Prüfe die Firestore-Regeln." : "Speichern hat nicht geklappt. Bist du online?"); }
/* Push aufs Handy über ntfy: jede Person hat ein eigenes Thema und stellt in der App ein,
   wofür sie Push bekommt (prefs/<Name> in der Datenbank). Eigene Aktionen schicken einem selbst nichts. */
const PUSH_EVENTS = [
  ["leer","Etwas ist leer","🚨",true], ["fastleer","Etwas ist fast leer","⚠️",false], ["kauf","Jemand hat eingekauft","🎉",true],
  ["muell","Müll ist voll","🗑️",true], ["kalender","Jemand ist nicht da (Kalender)","📅",false], ["chat","Neue Chat-Nachricht","💬",true],
  ["todo","Neues To-do","✅",true], ["geld","Jemand hat dir Geld zurückgegeben","💸",true] ];
const pushTopic = p => `${NTFY_TOPIC}-${p.toLowerCase()}`;
const wantsPush = (p,ev) => { const d=PUSH_EVENTS.find(x=>x[0]===ev); return !!d && (state.prefs[p]?.[ev] ?? d[3]); };
function sendPush(ev,title,message,tags,only){
  if(!NTFY_TOPIC || LOCAL_DEV) return;
  for(const p of PEOPLE){
    if(p===me || (only && p!==only) || !wantsPush(p,ev)) continue;
    try{ fetch("https://ntfy.sh/",{method:"POST",keepalive:true,body:JSON.stringify({topic:pushTopic(p),title,message,tags:[tags],priority:tags==="rotating_light"?4:3})}).catch(()=>{}); }catch(e){}
  }
}
/* Gegen Vertippen: Status-Meldungen gehen erst nach kurzer Wartezeit raus.
   Wer in der Zeit weiter- oder zurücktippt, verschickt nur den Endstand oder gar nichts. */
const PUSH_DELAY = 20000, pendingPush = new Map();
function notifyLater(key,ev,title,message,tags){
  cancelPush(key);
  const send=()=>{ pendingPush.delete(key); sendPush(ev,title,message,tags); };
  pendingPush.set(key,{send,t:setTimeout(send,PUSH_DELAY)});
}
function cancelPush(key){ const x=pendingPush.get(key); if(x){ clearTimeout(x.t); pendingPush.delete(key); } }
/* App wird verlassen: Wartende sofort verschicken, sonst gehen sie verloren */
function flushPush(){ for(const x of [...pendingPush.values()]){ clearTimeout(x.t); x.send(); } }
addEventListener("pagehide",flushPush);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushPush(); });
function showNotice(t){ $("#notice").innerHTML=`<div class="notice">${esc(t)}</div>`; }

let chatDraft="", firstChat=true;
function chatTime(ms){ return new Date(ms).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}) }
function chatDay(ms){ const d=new Date(ms), t=new Date(); const y=new Date(); y.setDate(t.getDate()-1);
  if(d.toDateString()===t.toDateString()) return "Heute"; if(d.toDateString()===y.toDateString()) return "Gestern";
  return d.toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit",year:"numeric"}); }
function unreadChat(){ if(!me) return 0; const seen=+(ls.get("wg_chatseen_"+me)||0); return state.chat.filter(m=>m.who!==me&&m.at>seen).length; }
function onChat(list){
  const before=new Set(state.chat.map(m=>m.id));
  state.chat=list;
  if(!firstChat){ const fresh=list.filter(m=>!before.has(m.id)&&m.who!==me); if(fresh.length&&!state.chatOpen){ const m=fresh[fresh.length-1]; toast(`💬 ${m.who}: ${m.text.slice(0,60)}`); play(); } }
  firstChat=false;
  if(state.chatOpen){ ls.set("wg_chatseen_"+me,String(Date.now())); renderChatList(); }
  updateBadges();
}
function chatHTML(){
  if(!state.chat.length) return `<div class="empty-state"><div class="big">💬</div><h3>Noch keine Nachrichten</h3><p>Schreibt hier rein, was sonst in der WG-Gruppe untergeht: „Wer hat meinen Joghurt gegessen?“</p></div>`;
  let out="", day="";
  for(const m of state.chat){
    const d=chatDay(m.at); if(d!==day){ day=d; out+=`<div class="daysep">${esc(d)}</div>`; }
    out+=`<div class="msg ${m.who===me?"mine":""}" style="--c:${COLORS[m.who]||"#888"}"><div class="who">${esc(m.who)}</div><div class="txt">${esc(m.text)}</div><div class="meta"><span class="time">${new Date(m.at).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})} · ${chatTime(m.at)}</span>${m.who===me?`<button class="del" data-delmsg="${esc(m.id)}" aria-label="Nachricht löschen">Löschen</button>`:""}</div></div>`;
  }
  return out;
}
function scrollChat(){ requestAnimationFrame(()=>{ const b=$("#chatList"); if(b) b.scrollTop=b.scrollHeight; }); }
async function sendChat(){

const fday = iso => new Date(iso+"T12:00").toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
const awayOn = (who,iso) => state.away.some(a=>a.who===who && a.from<=iso && iso<=a.to);
function awayRange(a){ return a.from===a.to ? fday(a.from) : `${fday(a.from)} – ${fday(a.to)}`; }

function renderKalender(){
  const now=new Date(), first=new Date(now.getFullYear(),now.getMonth()+state.calOff,1);
  const y=first.getFullYear(), m=first.getMonth(), days=new Date(y,m+1,0).getDate(), lead=(first.getDay()+6)%7;
  const today=isoDay(Date.now()), mFrom=isoDay(first.getTime()), mTo=isoDay(new Date(y,m,days).getTime());
  const title=first.toLocaleDateString("de-DE",{month:"long",year:"numeric"});
  const cell=d=>{ const iso=isoDay(new Date(y,m,d).getTime()), A=PEOPLE.filter(p=>awayOn(p,iso));
    return `<button class="day ${iso<today?"past":""} ${iso===today?"today":""} ${A.length>1?"multi":""}" data-day="${iso}" aria-label="${d}. ${esc(title)}: ${A.length?esc(A.join(", "))+" nicht da":"alle da"}">

      <span class="bars">${PEOPLE.map(p=>`<i style="${A.includes(p)?`background:${COLORS[p]}`:""}"></i>`).join("")}</span></button>`; };
  const list=state.away.filter(a=>a.to>=mFrom&&a.from<=mTo).sort((a,b)=>a.from.localeCompare(b.from)||PEOPLE.indexOf(a.who)-PEOPLE.indexOf(b.who));

  "Handseife":["seife","fluessigseife"], "Müllbeutel":["muellbeutel","muellsack","abfallbeutel"], "Waschmittel":["waschmittel","persil","ariel","colorwasch","vollwasch"],
  "Schwämme":["schwamm","schwaemme"], "Öl":["oel","olivenoel","sonnenblumenoel","rapsoel"], "Salz":["salz"], "Pfeffer":["pfeffer"], "Zucker":["zucker"], "Mehl":["mehl"]
};
const RC_SUM = /summe|zu zahlen|total|gesamt/i;
const RC_SKIP = /summe|zu zahlen|total|gesamt|\bbar\b|gegeben|r[uü]ckgeld|wechselgeld|ec[- ]?karte|karte|girocard|visa|mastercard|mwst|ust\b|steuer|netto|brutto|payback|punkte|bonus|tse|kasse|datum|uhrzeit|tel\.|www|danke/i;
const normTxt = s => String(s).toLocaleLowerCase("de").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
const toNum = raw => { const s=String(raw??"").trim().replace(/\s|€/g,"").replace(",","."); if(s==="") return null; const n=Number(s); return isFinite(n)?n:NaN; };
const isoDay = ms => { const d=new Date(ms); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };

function parseReceipt(text){
  const lines=String(text||"").split("\n").map(l=>l.replace(/\s+/g," ").trim()).filter(Boolean);
  let store="", date=null, total=null; const out=[];
  for(const l of lines.slice(0,15)){ const c=CHAINS.find(c=>new RegExp(`(^|[^a-zäöü])${c}([^a-zäöü]|$)`,"i").test(l)); if(c){ store=c; break; } }
  for(const l of lines){ const m=l.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/); if(!m) continue;
    const y=+m[3]<100?2000+ +m[3]:+m[3]; const t=new Date(y,+m[2]-1,+m[1],12).getTime();
    if(t<=Date.now()+864e5 && Date.now()-t<90*864e5){ date=t; break; } }
  for(const l of lines){
    const m=l.match(/^(.*?[a-zäöüß].*?)\s+(-?\d{1,4} ?[.,] ?\d{2})( ?-)?(?:\s*(?:€|eur))?[^a-z0-9äöüß]*[a-d0-9il]?[^a-z0-9äöüß]*$/i); if(!m) continue;
    const price=Number(m[2].replace(/ /g,"").replace(",","."));
    const name=m[1].replace(/^\d{3,}\s+/,"").replace(/[^\p{L}\p{N}%.,\/&+\- ]/gu,"").trim();
    if(RC_SKIP.test(name)){ if(total==null && RC_SUM.test(name) && price>0) total=price; continue; }
    if(/^\d+\s*[x×*=]|^\d+[,.]\s?\d/i.test(name) || name.replace(/[^a-zäöüß]/gi,"").length<2) continue;
    if(price<0 || m[3]){ if(out.length) out[out.length-1].price=Math.round((out[out.length-1].price-Math.abs(price))*100)/100; continue; }
    out.push({name,price});
  }
  return {store,date,total,lines:out};
}

function matchItem(line){
  const words=normTxt(line).split(/[^a-z]+/).filter(w=>w.length>=3); let best=null, score=0;
  for(const it of state.items){
    const keys=[normTxt(it.name).replace(/[^a-z]/g,""),...(ALIAS[it.name]||[])].filter(k=>k.length>=3);
    for(const k of keys) for(const w of words){
      const s = (w===k||(w.includes(k)&&(k.length>=5||w.startsWith(k)||w.endsWith(k)))) ? 10+k.length : (k.length>=6&&w.length>=5&&k.startsWith(w.slice(0,5))) ? 5 : 0;
      if(s>score){ score=s; best=it; }
    }
  }
  return best;
}

function loadImg(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{ URL.revokeObjectURL(u); res(im); }; im.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error("img")); }; im.src=u; }); }
/* Bild verkleinern und in Graustufen umrechnen (für OCR etwas mehr Kontrast) */
function grayCanvas(im,maxW,maxH,contrast=1){
  const s=Math.min(1,maxW/im.naturalWidth,maxH/im.naturalHeight);
  const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(im.naturalWidth*s)); c.height=Math.max(1,Math.round(im.naturalHeight*s));
  const x=c.getContext("2d"); x.drawImage(im,0,0,c.width,c.height);
  const d=x.getImageData(0,0,c.width,c.height), p=d.data;
  for(let i=0;i<p.length;i+=4){ let g=.299*p[i]+.587*p[i+1]+.114*p[i+2]; g=Math.max(0,Math.min(255,(g-128)*contrast+128)); p[i]=p[i+1]=p[i+2]=g; }
  x.putImageData(d,0,0); return c;
}
/* Adaptive Schwelle (Bradley): entfernt Schatten und ungleichmäßiges Licht, Text wird schwarz auf weiß */
function binarize(c){
  const x=c.getContext("2d"), W=c.width, H=c.height, d=x.getImageData(0,0,W,H), p=d.data, I=new Uint32Array((W+1)*(H+1));
  for(let y=0;y<H;y++){ let row=0; for(let k=0;k<W;k++){ row+=p[(y*W+k)*4]; I[(y+1)*(W+1)+k+1]=I[y*(W+1)+k+1]+row; } }
  const r=Math.max(8,Math.round(W/40));
  for(let y=0;y<H;y++){ const y0=Math.max(0,y-r), y1=Math.min(H,y+r+1);
    for(let k=0;k<W;k++){ const x0=Math.max(0,k-r), x1=Math.min(W,k+r+1);
      const sum=I[y1*(W+1)+x1]-I[y0*(W+1)+x1]-I[y1*(W+1)+x0]+I[y0*(W+1)+x0], i=(y*W+k)*4;
      p[i]=p[i+1]=p[i+2] = p[i]*(x1-x0)*(y1-y0) < sum*.88 ? 0 : 255; } }
  x.putImageData(d,0,0); return c;
}
/* Schräg fotografierten Bon geraderücken: Winkel mit den schärfsten Textzeilen suchen (−6° bis +6°) */
function deskew(c){
  const sm=document.createElement("canvas"), f=Math.min(1,500/c.width); sm.width=Math.round(c.width*f); sm.height=Math.round(c.height*f);
  sm.getContext("2d").drawImage(c,0,0,sm.width,sm.height); binarize(sm);
  const rot=(src,a,W,H)=>{ const t=document.createElement("canvas"); t.width=W; t.height=H; const x=t.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,W,H);
    x.translate(W/2,H/2); x.rotate(a*Math.PI/180); x.drawImage(src,-src.width/2,-src.height/2); return t; };
  let best=0, bs=-1;
  for(let a=-6;a<=6;a+=.5){ const t=rot(sm,a,sm.width,sm.height), d=t.getContext("2d").getImageData(0,0,t.width,t.height).data; let sc=0, prev=0;
    for(let y=0;y<t.height;y++){ let r=0; for(let k=0;k<t.width;k++) if(d[(y*t.width+k)*4]<128) r++; sc+=(r-prev)**2; prev=r; }
    if(sc>bs){ bs=sc; best=a; } }
  return best ? rot(c,best,c.width,c.height) : c;
}
/* Kleine Fotos hochskalieren: Tesseract liest größere Schrift deutlich besser */
function upscale(c){
  const f=Math.min(2,2400/c.width); if(f<=1.05) return c;
  const d=document.createElement("canvas"); d.width=Math.round(c.width*f); d.height=Math.round(c.height*f);
  const x=d.getContext("2d"); x.imageSmoothingQuality="high"; x.drawImage(c,0,0,d.width,d.height); return d;
}
/* Bon-Foto stark komprimiert (Ziel: unter ~150 KB), damit es in ein Firestore-Dokument passt */
function compressImg(im){
  let w=720, h=2600, url="";
  for(let i=0;i<6;i++){ const c=grayCanvas(im,w,h,1.1); for(const q of [.55,.4,.3]){ url=c.toDataURL("image/jpeg",q); if(url.length<200000) return url; } w*=.8; h*=.8; }
  return url;
}
let tessP=null;
function loadTesseract(){ return tessP ||= new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=TESS_SRC; s.onload=()=>res(window.Tesseract); s.onerror=()=>{ tessP=null; s.remove(); rej(new Error("tesseract")); }; document.head.appendChild(s); }); }

function scanReceipt(){
  if(!me){ pickMe(); return; }
  const inp=document.createElement("input"); inp.type="file"; inp.accept="image/*";
  inp.onchange=()=>{ const f=inp.files?.[0]; if(f) readReceipt(f); };

async function readReceipt(file){
  let cancelled=false, worker=null;
  openModal(`<div class="sheet" role="dialog" aria-modal="true"><h2>Bon wird gelesen…</h2><p class="sub" id="rstat">Foto wird vorbereitet</p>
    <div class="progress"><span id="rbar"></span></div><div class="actions"><button class="btn ghost" id="rcx">Abbrechen</button></div></div>`);
  $("#modal .scrim").dataset.lock="1";
  $("#rcx").onclick=()=>{ cancelled=true; worker?.terminate(); closeModal(); };
  const stat=(t,p)=>{ if(cancelled) return; const s=$("#rstat"), b=$("#rbar"); if(s) s.textContent=t; if(b&&p!=null) b.style.width=Math.round(p*100)+"%"; };
  let im; try{ im=await loadImg(file); }catch(e){ if(!cancelled){ closeModal(); toast("Das Bild konnte nicht geöffnet werden."); } return; }
  const img=compressImg(im);
  let text="";
  try{
    stat("Texterkennung wird geladen (beim ersten Mal etwas länger)",.05);
    const T=await loadTesseract(); if(cancelled) return;
    worker=await T.createWorker("deu",1,{logger:m=>{ if(m.status==="recognizing text") stat("Text wird erkannt",.15+m.progress*.85); }});
    if(cancelled){ worker.terminate(); return; }
    await worker.setParameters({tessedit_pageseg_mode:"4"});
    text=(await worker.recognize(upscale(deskew(grayCanvas(im,1600,4500,1.5))))).data.text||"";
    if(parseReceipt(text).lines.length<2 && !cancelled){ stat("Zweiter Versuch",.5);
      const t2=(await worker.recognize(binarize(upscale(grayCanvas(im,1600,4500))))).data.text||"";
      if(parseReceipt(t2).lines.length>parseReceipt(text).lines.length) text=t2; }
    worker.terminate();
  }catch(e){ console.error(e); if(cancelled) return; toast("Bon konnte nicht gelesen werden. Trag die Artikel selbst ein."); }
  if(cancelled) return;
  const r=parseReceipt(text);
  const lines=r.lines.map(l=>{ const it=matchItem(l.name); return {name:l.name,price:l.price,itemId:it?.id||"",on:!!it}; });
  reviewReceipt({store:r.store,date:r.date,total:r.total,img,lines,text});
}

/* ---------- Geld: wer schuldet wem ---------- */
/* Einkäufe werden gedrittelt. Ausgleichszahlungen (kind:"settle") verschieben nur Geld zwischen zwei Personen. */
function money(){
  const real=state.purchases.filter(p=>p.kind!=="settle");
  const paid=Object.fromEntries(PEOPLE.map(n=>[n,0]));
  real.forEach(p=>{ if(p.who in paid) paid[p.who]+=p.price||0; });
  const total=PEOPLE.reduce((s,n)=>s+paid[n],0), share=total/PEOPLE.length;
  const bal=Object.fromEntries(PEOPLE.map(n=>[n,paid[n]-share]));
  state.purchases.forEach(p=>{ if(p.kind==="settle" && p.who in bal && p.to in bal){ bal[p.who]+=p.price||0; bal[p.to]-=p.price||0; } });
  // Überweisungen: größter Schuldner zahlt an größten Gläubiger
  const deb=PEOPLE.filter(n=>bal[n]<-.005).map(n=>[n,-bal[n]]).sort((a,b)=>b[1]-a[1]);
  const cred=PEOPLE.filter(n=>bal[n]>.005).map(n=>[n,bal[n]]).sort((a,b)=>b[1]-a[1]);
  const tx=[]; let i=0, j=0;
  while(i<deb.length && j<cred.length){ const x=Math.min(deb[i][1],cred[j][1]);
    if(x>=.01) tx.push({from:deb[i][0],to:cred[j][0],amount:Math.round(x*100)/100});
    deb[i][1]-=x; cred[j][1]-=x; if(deb[i][1]<.005) i++; if(cred[j][1]<.005) j++; }
  return {real,total,share,bal,tx};
}

async function toggleTodo(id){
  const t=state.todos.find(x=>x.id===id); if(!t) return;

/* ---------- Home: To-dos + Überblick ---------- */
/* Automatische To-dos entstehen aus dem Stand der App und verschwinden von selbst */
function autoTodos(){
  const out=[], today=isoDay(Date.now());
  const need=state.items.filter(i=>i.status!=="full").sort((a,b)=>(a.status==="empty"?0:1)-(b.status==="empty"?0:1));
  if(need.length){
    const mStart=new Date(new Date().getFullYear(),new Date().getMonth(),1).getTime();
    const cnt=Object.fromEntries(PEOPLE.map(n=>[n,0])); state.purchases.forEach(p=>{ if(p.kind!=="settle"&&p.at>=mStart&&p.who in cnt) cnt[p.who]++; });
    const here=PEOPLE.filter(p=>!awayOn(p,today)), min=Math.min(...here.map(p=>cnt[p])), low=here.filter(p=>cnt[p]===min);
    const turn=low.length===1&&here.length>1?low[0]:"";
    const names=need.slice(0,3).map(i=>i.name).join(", ")+(need.length>3?` +${need.length-3}`:"");
    out.push({who:turn===me?me:"",em:"🛒",title:turn===me?"Du bist mit Einkaufen dran":"Einkaufen",sub:esc(names)+(turn&&turn!==me?` · Vorschlag: ${esc(turn)}`:""),btn:`<button class="btn sm" data-go="liste">Liste</button>`});
  }
  for(const [id,name,em] of BINS){ const b=state.bins[id];
    if(b?.status==="full") out.push({who:"",em,title:`${name} rausbringen`,sub:`Voll gemeldet von ${esc(b.by)}, ${ago(b.at)}`,btn:`<button class="btn sm" data-bin="${id}">Erledigt</button>`}); }
  for(const t of money().tx) if(t.from===me && t.amount>=1)
    out.push({who:me,em:"💸",title:`${t.to} ${eur(t.amount)} zahlen`,sub:"Damit ihr wieder quitt seid",btn:`<button class="btn sm" data-settle="${t.from}|${t.to}|${t.amount}">Bezahlt</button>`});
  return out;
}
function renderHome(){
  const autos=autoTodos();
  const visible=state.todos.filter(t=>!t.done||Date.now()-(t.doneAt||0)<12*36e5).sort((a,b)=>(a.done-b.done)||(b.at-a.at));
  const autoRow=a=>`<div class="todo"><span class="em" aria-hidden="true">${a.em}</span><div class="tx"><b>${esc(a.title)}</b><span>${a.sub}</span></div>${a.btn}</div>`;
  const ownRow=t=>`<div class="todo ${t.done?"done":""}"><button class="check" data-todo-done="${t.id}" aria-pressed="${!!t.done}" aria-label="${esc(t.text)}: ${t.done?"erledigt":"offen"}">✓</button>
    <button class="tx" data-todo="${t.id}"><b>${esc(t.text)}</b><span>${t.done?`erledigt von ${esc(t.doneBy)}`:`${t.who?"für "+esc(t.who===me?"dich":t.who):"WG"} · ${esc(t.by)}, ${ago(t.at)}`}</span></button>${t.who&&t.who!==me?avatar(t.who):""}</div>`;
  const mine=[...autos.filter(a=>a.who===me).map(autoRow),...visible.filter(t=>me&&t.who===me).map(ownRow)];
  const wg=[...autos.filter(a=>a.who!==me).map(autoRow),...visible.filter(t=>!me||t.who!==me).map(ownRow)];
  const open=autos.length+state.todos.filter(t=>!t.done).length;
  const dateStr=new Date().toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"});
  return `<div class="hello"><h2>${me?`Hi ${esc(me)} 👋`:"Hi 👋"}</h2><p>${esc(dateStr)} · ${open?`${open} ${open===1?"Sache":"Sachen"} offen`:"Alles erledigt ✨"}</p></div>
    <div class="section-h">Für dich</div>
    ${mine.length?`<div class="todos">${mine.join("")}</div>`:`<p class="empty-mini">Nichts für dich zu tun. Gönn dir. 🛋️</p>`}
    <div class="section-h">WG</div>
    ${wg.length?`<div class="todos">${wg.join("")}</div>`:`<p class="empty-mini">Die WG läuft. Keine offenen Aufgaben.</p>`}
    <button class="btn ghost wide" id="addTodo" style="margin-top:10px">＋ To-do anlegen</button>
    <div class="section-h">Überblick</div>
    <div class="dash">${cardVorrat()}${cardMuell()}${cardDa()}${cardGeld()}</div>`;
}
function cardVorrat(){
  const c={full:0,low:0,empty:0}; state.items.forEach(i=>c[i.status||"full"]++);
  const need=state.items.filter(i=>i.status!=="full").sort((a,b)=>(a.status==="empty"?0:1)-(b.status==="empty"?0:1));
  return `<button class="dcard" data-go="${need.length?"liste":"vorrat"}"><span class="dh"><span>🧺 Vorrat</span><span aria-hidden="true">›</span></span>

function cardMuell(){
  return `<div class="dcard"><span class="dh"><span>🗑️ Müll</span></span>
    ${BINS.map(([id,name,em])=>{ const full=state.bins[id]?.status==="full";
      return `<button class="drow" data-bin="${id}" aria-label="${name}: ${full?"voll":"okay"}. Tippen zum Ändern"><span>${em} ${name}</span><span class="tag ${full?"full":""}">${full?"Voll":"Okay"}</span></button>`; }).join("")}</div>`;
}
function cardDa(){
  const today=isoDay(Date.now()), here=PEOPLE.filter(p=>!awayOn(p,today));
  const awayNow=state.away.filter(a=>a.from<=today&&today<=a.to);
  const in7=isoDay(Date.now()+7*864e5), soon=state.away.filter(a=>a.from>today&&a.from<=in7).sort((a,b)=>a.from.localeCompare(b.from));
  const lines=[...awayNow.map(a=>`${esc(a.who)} weg bis ${esc(fday(a.to))}`),...soon.slice(0,2).map(a=>`${esc(a.who)} ab ${esc(fday(a.from))}`)];

    <span class="dsub">${lines.length?lines.join("<br>"):"Diese Woche sind alle da"}</span></button>`;
}
function cardGeld(){
  const M=money(), b=me?M.bal[me]:0, last=state.purchases.filter(p=>p.kind!=="settle").sort((a,c)=>c.at-a.at)[0];

function renderVorrat(){
  const items=state.items;
  if(!items.length) return binsHTML()+`<div class="empty-state"><div class="big">🧺</div><h3>Noch keine Vorräte</h3><p>Leg mit den üblichen WG-Basics los oder füg eigene Artikel hinzu.</p><div class="actions" style="max-width:340px;margin:16px auto 0"><button class="btn" id="seed">Startartikel anlegen</button><button class="btn ghost" id="addNew">Eigener Artikel</button></div></div>`;

  const cats=["Alle",...CATS.filter(k=>items.some(i=>i.cat===k))];
  if(!cats.includes(state.cat)) state.cat="Alle";
  const shown = state.cat==="Alle"?items:items.filter(i=>i.cat===state.cat);
  const groups = state.cat==="Alle" ? CATS.map(k=>[k,shown.filter(i=>i.cat===k)]).filter(g=>g[1].length) : [[state.cat,shown]];
  const tile=i=>`<button class="tile ${i.status||"full"}" data-id="${i.id}" aria-label="${esc(i.name)}: ${ST_LABEL[i.status||"full"]}. Tippen zum Ändern">

  return binsHTML()+`<div class="summary"><span class="pill ok"><span class="dot"></span>${c.full} voll</span><span class="pill low"><span class="dot"></span>${c.low} fast leer</span><span class="pill empty"><span class="dot"></span>${c.empty} leer</span></div>
    <p class="mood">${esc(mood(items))}</p>
    <div class="cats" role="group" aria-label="Kategorie">${cats.map(k=>`<button data-cat="${k}" aria-pressed="${k===state.cat}">${k}</button>`).join("")}<button data-toggle-edit aria-pressed="${state.edit}">${state.edit?"Fertig":"✏️ Bearbeiten"}</button></div>

    <p class="hint">${state.edit?"Tippe auf ✏️, um einen Artikel zu ändern oder zu löschen.":"Antippen wechselt: Voll → Fast leer → Leer → Voll. Gekauft? In der Einkaufsliste abhaken, dann wird es automatisch wieder grün."}</p>`;

function renderGeld(){
  const P=state.purchases.slice().sort((a,b)=>b.at-a.at);
  const now=new Date(); const mStart=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const month=P.filter(p=>p.at>=mStart);
  const stats=Object.fromEntries(PEOPLE.map(n=>[n,{count:0,sum:0,mcount:0}]));
  const M=money();
  P.forEach(p=>{ if(p.kind!=="settle" && stats[p.who]){ stats[p.who].count++; stats[p.who].sum+=p.price||0; if(p.at>=mStart) stats[p.who].mcount++; } });
  const total=PEOPLE.reduce((s,n)=>s+stats[n].sum,0); const share=total/PEOPLE.length;
  const mc=PEOPLE.map(n=>stats[n].mcount); const max=Math.max(...mc), min=Math.min(...mc);
  const monthName=now.toLocaleDateString("de-DE",{month:"long"});
  const board=`<div class="section-h">Wer kauft ein? (${monthName})</div><div class="board">${PEOPLE.map(n=>{
    const s=stats[n]; const isTop=max>0&&s.mcount===max; const isMessi=isTop||s.mcount>0;
    return `<div class="person">${isTop?`<span class="crown" aria-label="Nummer 1 im Monat">👑</span>`:""}${avatar(n)}<b>${n}</b><div class="num">${s.mcount}×</div><small>gesamt ${eur(s.sum)}</small><span class="title">${isMessi?"Messi-Fan 🐐":"Ronaldo-Fan 😤"}</span></div>`}).join("")}</div>`;
  const bal = total>0 ? `<div class="section-h">Wer schuldet wem? (alles gedrittelt)</div><div class="card balance">
     <div><span>Gesamt ausgegeben</span><span class="money">${eur(total)}</span></div><div><span>Anteil pro Person</span><span class="money">${eur(share)}</span></div>
     ${PEOPLE.map(n=>{const d=M.bal[n]; return `<div><span>${n}</span><span class="money ${d>=0.005?"pos":d<=-0.005?"neg":""}">${d>=0.005?"bekommt "+eur(d):d<=-0.005?"zahlt "+eur(-d):"ausgeglichen"}</span></div>`}).join("")}
     ${M.tx.length?`<div style="border-top:1px solid var(--line);padding-top:8px;margin-top:2px"><b>So werdet ihr quitt</b></div>${M.tx.map(t=>`<div style="align-items:center"><span>${esc(t.from)} → ${esc(t.to)} <span class="money">${eur(t.amount)}</span></span><button class="btn sm ghost" data-settle="${t.from}|${t.to}|${t.amount}">Bezahlt</button></div>`).join("")}`:""}</div>` : "";
  const list = P.length ? `<div class="section-h">Alle Einkäufe</div><div class="list">${P.map(p=>`<div class="row">${avatar(p.who)}<div class="tx"><b>${esc(p.emoji||"🛍️")} ${esc(p.item)}</b><span>${esc(p.who)} · ${fdate(p.at)}${p.store?" · "+esc(p.store):""}</span></div><span class="money">${p.price==null?"–":eur(p.price)}</span>${p.receiptId?`<button class="iconbtn" style="box-shadow:none;background:var(--surface-2);width:34px;height:34px;font-size:15px" data-rcpt="${p.receiptId}" aria-label="Kassenbon ansehen">🧾</button>`:""}<button class="iconbtn" style="box-shadow:none;background:var(--surface-2);width:34px;height:34px;font-size:14px" data-delp="${p.id}" aria-label="Eintrag löschen">✕</button></div>`).join("")}</div>`
    : `<div class="empty-state"><div class="big">🧾</div><h3>Noch keine Einkäufe</h3><p>Wenn jemand in der Einkaufsliste auf „Gekauft“ tippt und den Preis einträgt, landet es hier.</p></div>`;
  return board+bal+`<button class="btn wide" data-scan style="margin-top:14px">🧾 Kassenbon scannen</button><button class="btn ghost wide" id="manual" style="margin-top:8px">＋ Einkauf eintragen</button>`+list;
}

  document.querySelectorAll("[data-cal]").forEach(b=>b.onclick=()=>{ const d=+b.dataset.cal; state.calOff=d?state.calOff+d:0; play("pop"); render(); });
  const aa=$("#addAway"); if(aa) aa.onclick=()=>awaySheet(null);
  document.querySelectorAll("[data-delp]").forEach(b=>{ let armed=false; b.onclick=async()=>{ if(!armed){armed=true;b.textContent="?";b.setAttribute("aria-label","Nochmal tippen zum Löschen");setTimeout(()=>{armed=false;b.textContent="✕"},2500);return;} play("trash"); await Store.delPurchase(b.dataset.delp); }; });
}

document.querySelectorAll("nav.tabs [data-tab]").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; state.edit=false; state.calOff=0; play("pop"); render(); scrollTo(0,0); });
$("#meBtn").onclick=pickMe;
$("#pushBtn").onclick=pushSheet;
$("#soundBtn").onclick=()=>{ muted=!muted; ls.set("wg_muted",muted?"1":"0"); render(); if(!muted) play("bell"); };
setInterval(()=>{ if(state.tab==="liste"||state.tab==="home") render(); },60000);
bindChat();

/* ---------- Passwort-Abfrage ---------- */
async function sha256(t){ const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join(""); }
function start(){ render(); Store.init(); }
function gate(){
  if(ls.get("wg_unlocked")===PASS_HASH){ start(); return; }
  const g=document.createElement("div"); g.className="gate";
  g.innerHTML=`<form class="box" id="gateForm"><img src="apple-touch-icon.png" alt=""><h2>WG Vorrat</h2><p>Nur für Leon, Lucio und Yannick.</p>
    <input id="gatePw" type="password" placeholder="Passwort" autocomplete="current-password" autocapitalize="off" aria-label="Passwort">
    <button class="btn wide" type="submit">Reinkommen</button><div class="err" id="gateErr" role="alert"></div></form>`;
  document.body.appendChild(g); setTimeout(()=>$("#gatePw").focus(),50);
  $("#gateForm").onsubmit=async e=>{ e.preventDefault();
    const inp=$("#gatePw"); const h=await sha256(inp.value.trim().toLowerCase());
    if(h===PASS_HASH){ ls.set("wg_unlocked",PASS_HASH); g.remove(); play(); start(); }
    else { inp.classList.remove("wrong"); void inp.offsetWidth; inp.classList.add("wrong"); $("#gateErr").textContent="Falsches Passwort. Versuch’s nochmal."; inp.select(); }
  };
}
gate();
</script>
