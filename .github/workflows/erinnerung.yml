# Tägliche Erinnerung um 15 Uhr (Berlin), solange etwas leer oder ein Müll voll ist.
# Cron läuft in UTC: 13 Uhr UTC = 15 Uhr Sommerzeit, 14 Uhr UTC = 15 Uhr Winterzeit. Das Skript wählt den passenden Lauf.
# Von Hand gestartet (workflow_dispatch) wird sofort geschickt.
name: Erinnerung
on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:
jobs:
  erinnerung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/erinnerung.py ${{ github.event_name == 'schedule' && format('--slot={0}', github.event.schedule == '0 13 * * *' && '13' || '14') || '' }}
